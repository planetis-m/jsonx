name: Nim CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: 'stable'
        repo-token: ${{ github.token }}
    - name: Run tests
      run: |
        nim c -r tests/test_parsejson.nim
        nim c -r tests/test.nim

  test-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: 'stable'
        repo-token: ${{ github.token }}
    - name: Run tests
      run: |
        nim c -r tests\test_parsejson.nim
        nim c -r tests\test.nim

  test-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v6
    - uses: jiro4989/setup-nim-action@v2
      with:
        nim-version: 'stable'
        repo-token: ${{ github.token }}
    - name: Run tests
      run: |
        nim c -r tests/test_parsejson.nim
        nim c -r tests/test.nim
